<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Meeting</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    height: 100vh; overflow: hidden;
    background: #0d1117;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    color: #fff;
    display: flex; flex-direction: column;
  }
  .titlebar {
    height: 38px; flex: none; display: flex; align-items: center; gap: 10px;
    padding: 0 14px; background: #161b22; border-bottom: 1px solid #21262d;
    font-size: 12px; color: #8b949e;
  }
  .dots { display: flex; gap: 7px; }
  .dots i { width: 11px; height: 11px; border-radius: 50%; display: block; }
  .stage { flex: 1; display: grid; grid-template-columns: 2.1fr 1fr; gap: 12px; padding: 12px; min-height: 0; }
  .share {
    border-radius: 12px; overflow: hidden; position: relative;
    background: linear-gradient(150deg, #1b2430, #101821);
    display: flex; flex-direction: column; padding: 30px 34px; gap: 16px;
  }
  .share h1 { font-size: 27px; font-weight: 680; letter-spacing: -0.4px; }
  .share h2 { font-size: 14px; font-weight: 500; color: #7d8ea3; margin-top: -8px; }
  .bars { display: flex; align-items: flex-end; gap: 16px; height: 190px; margin-top: 14px; }
  .bars div { flex: 1; border-radius: 7px 7px 3px 3px; background: linear-gradient(180deg, #4a7fd4, #2d4d80); position: relative; }
  .bars div::after {
    content: attr(data-l); position: absolute; bottom: -22px; left: 0; right: 0;
    text-align: center; font-size: 11px; color: #6b7c91;
  }
  .bullets { margin-top: 30px; display: flex; flex-direction: column; gap: 9px; }
  .bullets span { font-size: 13.5px; color: #9fb0c4; display: flex; gap: 10px; }
  .bullets span::before { content: '▸'; color: #4a7fd4; }
  .tiles { display: grid; grid-template-rows: repeat(3, 1fr); gap: 12px; min-height: 0; }
  .tile {
    border-radius: 12px; position: relative; overflow: hidden;
    display: grid; place-items: center;
  }
  .tile .avatar {
    width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center;
    font-size: 26px; font-weight: 620; color: rgba(255,255,255,0.92);
    background: rgba(0,0,0,0.22); box-shadow: inset 0 2px 0 rgba(255,255,255,0.14);
  }
  .tile .nm {
    position: absolute; left: 11px; bottom: 10px; font-size: 12px; font-weight: 550;
    background: rgba(0,0,0,0.55); padding: 3px 9px; border-radius: 6px;
  }
  .tile.speaking { outline: 3px solid #3fb950; outline-offset: -3px; }
  .t1 { background: linear-gradient(140deg, #3d5a80, #293f5c); }
  .t2 { background: linear-gradient(140deg, #5c4a7d, #3d3159); }
  .t3 { background: linear-gradient(140deg, #2f6b5f, #1f4a42); }
  .controls {
    height: 62px; flex: none; display: flex; align-items: center; justify-content: center; gap: 13px;
    background: #161b22; border-top: 1px solid #21262d;
  }
  .ctl {
    width: 42px; height: 42px; border-radius: 50%; background: #21262d;
    display: grid; place-items: center; font-size: 16px; color: #c9d1d9;
  }
  .ctl.red { background: #da3633; }
</style>
</head>
<body>
  <div class="titlebar">
    <div class="dots"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
    <span>Weekly Sync — 3 participants · 24:11</span>
  </div>
  <div class="stage">
    <div class="share">
      <h1>Q3 Growth Review</h1>
      <h2>Shared by Priya Raghavan</h2>
      <div class="bars">
        <div data-l="Apr" style="height:44%"></div>
        <div data-l="May" style="height:58%"></div>
        <div data-l="Jun" style="height:52%"></div>
        <div data-l="Jul" style="height:71%"></div>
        <div data-l="Aug" style="height:88%"></div>
        <div data-l="Sep" style="height:96%"></div>
      </div>
      <div class="bullets">
        <span>Activation up 34% quarter over quarter</span>
        <span>Churn down to 2.1%, best since launch</span>
        <span>Enterprise pipeline needs a staffing decision</span>
      </div>
    </div>
    <div class="tiles">
      <div class="tile t1 speaking"><div class="avatar">PR</div><div class="nm">Priya Raghavan</div></div>
      <div class="tile t2"><div class="avatar">DM</div><div class="nm">Daniel Moreau</div></div>
      <div class="tile t3"><div class="avatar">You</div><div class="nm">You</div></div>
    </div>
  </div>
  <div class="controls">
    <div class="ctl">🎙</div><div class="ctl">📹</div><div class="ctl">🖥</div>
    <div class="ctl">💬</div><div class="ctl">👥</div><div class="ctl red">☎</div>
  </div>
</body>
</html>
